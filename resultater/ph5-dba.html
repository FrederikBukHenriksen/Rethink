<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PH5 på DBA</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Bricolage+Grotesque:wght@600;700&family=Quicksand:wght@300&display=swap">
<style>
/* Layout as in the Søgerapport page: Rethink wordmark, one line of status, one category tab, filters, a flat list where each listing is a row with a detail line, and coverage at the bottom. */
:root {
  --bg: #f2f5f3; --surface: #ffffff; --fg: #16211e; --muted: #5b6a65; --line: #d6dfdb;
  --accent: #1d5c52; --accent-soft: #dcebe7; --ok: #1e6b3a; --warn: #8a5a00; --no: #8f2d2d;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-logo: "Quicksand", "Nunito", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1614; --surface: #17211e; --fg: #e6eeea; --muted: #9aaba5; --line: #2a3834;
    --accent: #6cc4b2; --accent-soft: #1e3531; --ok: #7fd49a; --warn: #e8b85a; --no: #ee9a9a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1614; --surface: #17211e; --fg: #e6eeea; --muted: #9aaba5; --line: #2a3834;
  --accent: #6cc4b2; --accent-soft: #1e3531; --ok: #7fd49a; --warn: #e8b85a; --no: #ee9a9a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 820px; margin: 0 auto; display: grid; gap: 24px; }
h1, h2 { font-family: var(--font-display); letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
h1 { font-size: 28px; line-height: 1.1; }
h2 { font-size: 18px; }
a { color: inherit; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.head { display: grid; gap: 6px; }
.logo { font-family: var(--font-logo); font-weight: 300; font-size: 20px; letter-spacing: 0.18em; line-height: 1; color: var(--fg); }
.logo .bar { display: inline-block; width: 2px; height: 1.2em; margin-left: 0.55em; background: currentColor; vertical-align: -0.2em; }
.sub { margin: 0; color: var(--muted); font-size: 13px; }

.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tab { font: inherit; font-weight: 600; background: none; border: 0; border-bottom: 3px solid var(--accent); margin-bottom: -1px; color: var(--fg); padding: 10px 14px; white-space: nowrap; }
.tab .n { font-family: var(--font-mono); font-size: 12px; font-weight: 400; margin-left: 7px; color: var(--muted); }

.filters { display: grid; gap: 10px; }
.filters-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; }
@media (max-width: 620px) { .filters-row { grid-template-columns: 1fr 1fr; } .filters-row input[type="search"] { grid-column: 1 / -1; } }
input[type="search"], select {
  font: inherit; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; width: 100%;
}
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; white-space: nowrap; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.reset { font: inherit; font-size: 13px; background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.reset:hover { background: var(--accent-soft); }

.results { display: grid; gap: 0; }
.listbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding-bottom: 8px; border-bottom: 2px solid var(--fg); color: var(--muted); font-size: 13px; }

details.item { border-bottom: 1px solid var(--line); }
details.item summary {
  list-style: none; cursor: pointer; padding: 11px 0;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; row-gap: 2px;
}
details.item summary::-webkit-details-marker { display: none; }
.title { min-width: 0; font-weight: 600; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title a { text-decoration: none; }
.title a:hover { text-decoration: underline; color: var(--accent); }
.price { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.meta { grid-column: 1 / -1; min-width: 0; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta .sep { padding-inline: 5px; opacity: .6; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .no { color: var(--no); }
.more { padding: 0 0 12px; display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.more p { margin: 0; overflow-wrap: anywhere; }
.more strong { color: var(--fg); }
.empty { padding: 14px 0; color: var(--muted); border-bottom: 1px solid var(--line); }

.cover h2 { margin-bottom: 4px; }
.cover details { border-top: 1px solid var(--line); padding-block: 9px; }
.cover summary { cursor: pointer; font-weight: 600; }
.cover ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 5px; color: var(--muted); font-size: 14px; }
.cover h4 { margin: 10px 0 0; font-size: 14px; }
</style>

<main>
  <header class="head">
    <div class="logo" role="img" aria-label="Rethink">RETHINK<span class="bar" aria-hidden="true"></span></div>
    <h1>Søgerapport</h1>
    <p class="sub" id="sub"></p>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Søgninger"></nav>

  <section class="filters" aria-label="Filtre">
    <div class="filters-row">
      <input id="q" type="search" placeholder="Søg i navn, by, forbehold …" aria-label="Søg" autocomplete="off">
      <label class="check" for="f-direct"><input id="f-direct" type="checkbox"> Kan købes direkte</label>
      <button id="reset" class="reset" type="button">Nulstil filtre</button>
    </div>
  </section>

  <div class="results">
    <div class="listbar">
      <span id="count" aria-live="polite"></span>
      <select id="f-sort" aria-label="Sortér"><option value="new">Nyeste først</option><option value="asc">Pris, lav først</option><option value="desc">Pris, høj først</option></select>
    </div>
    <section id="liste" aria-label="Fund"></section>
  </div>

  <section class="cover" id="runs" aria-label="Søgedækning og begrænsninger"></section>
</main>

<script>
(function () {
  var TZ = "Europe/Copenhagen";

  /* Data from this run. Layout matches templates/FIND_SCHEMA.md. Not stored in the living page's database. */
  var CATEGORY = { id: "lamper", name: "Lamper", workbook: "DBA-lampesøgning.xlsx", sheet: "Søgeliste" };
  var RUN = {
    date: "2026-11-08T11:28:00+01:00",
    platforms: ["DBA"],
    sections: [
      { title: "Gennemført", items: [
        "Søgt på \"ph5\" på DBA, sorteret nyeste først. De tre nyeste annoncer er gennemgået.",
        "PH5 er ikke en række i Søgeliste, så søgningen er ad hoc uden farve- eller maksprisfilter."
      ] },
      { title: "Ikke gennemført", items: [
        "Kun de tre nyeste af 227 resultater er gennemgået. Resten er ikke set."
      ] },
      { title: "Begrænsninger", items: [
        "Datoerne er relative tidsangivelser fra DBA-listen (1 t., 18 t.), ikke absolutte datoer.",
        "Cookie-banneret blev ikke accepteret. Pris og beskrivelse er læst fra annoncens strukturerede data."
      ] },
      { title: "Fravalgt", items: [
        "PH5 Loftlampe, Brønderslev, 1.200 kr. (dba.dk/…/26543047): beskrivelsen siger, at lampen trænger til en ny fatning. Reparation, derfor ikke med."
      ] }
    ]
  };
  var FINDS = [
    {
      id: "dba-26560542", name: "PH5 Classic loft lampe i hvid", type: "Loftlampe", colors: ["Hvid", "Rød", "Blå"],
      plat: "DBA", city: "Vanløse", direct: "Nej", status: "Bekræftet",
      link: "https://www.dba.dk/recommerce/forsale/item/26560542",
      listedAt: "2026-11-08T10:28:00+01:00", dateKind: "redigeret", dateApprox: true,
      price: 1800, priceHistory: [{ d: "08.11", p: 1800 }], firstSeen: "2026-11-08T11:28:00+01:00",
      lastChecked: "2026-11-08T11:28:00+01:00", available: "ja",
      note: "Titel og beskrivelse siger PH5 og Louis Poulsen. Flere hvide skærme med en rød detalje ved fatningen og blå i bunden. Brugt, med brugs-spor."
    },
    {
      id: "dba-26546368", name: "Louis Poulsen Poul Henningsen PH5 lampe", type: "Loftlampe", colors: ["Hvid", "Blå", "Rød"],
      plat: "DBA", city: "Bramming", direct: "Ja", status: "Bekræftet",
      link: "https://www.dba.dk/recommerce/forsale/item/26546368",
      listedAt: "2026-11-07T17:28:00+01:00", dateKind: "redigeret", dateApprox: true,
      price: 1200, priceHistory: [{ d: "07.11", p: 1200 }], firstSeen: "2026-11-08T11:28:00+01:00",
      lastChecked: "2026-11-08T11:28:00+01:00", available: "ja",
      note: "Titel og beskrivelse siger PH5 og Louis Poulsen. Flere skærme i hvid med blå og røde detaljer. Den inderste hvide skærm har lidt patina. Købes direkte med Fiks færdig."
    }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var els = { q: $("q"), direct: $("f-direct"), sort: $("f-sort"), liste: $("liste"), count: $("count"), reset: $("reset"), sub: $("sub"), runs: $("runs"), tabs: $("tabs") };
  var openIds = {};

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function kr(n) { return Number(n).toLocaleString("da-DK") + " kr."; }
  function parts(iso) {
    var t = Date.parse(iso); if (isNaN(t)) return null;
    var o = {};
    new Intl.DateTimeFormat("da-DK", { timeZone: TZ, day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
      .formatToParts(new Date(t)).forEach(function (p) { o[p.type] = p.value; });
    return o;
  }
  function dm(iso) { var p = parts(iso); return p ? p.day + "." + p.month : ""; }
  function dmy(iso) { var p = parts(iso); return p ? p.day + "." + p.month + "." + p.year : ""; }
  function hm(iso) { var p = parts(iso); return p ? p.hour + "." + p.minute : ""; }
  function dateLabel(f) {
    var kind = f.dateKind === "uploadet" ? "Uploadet" : "Redigeret";
    return kind + " " + dm(f.listedAt) + (f.dateApprox ? " ca. kl. " + hm(f.listedAt).split(".")[0] : " kl. " + hm(f.listedAt));
  }

  function render(f) {
    var d = el("details", "item");
    d.open = openIds[f.id] === true;
    d.addEventListener("toggle", function () { openIds[f.id] = d.open; });
    var s = el("summary");
    var t = el("div", "title");
    var a = el("a", null, f.name); a.href = f.link; a.target = "_blank"; a.rel = "noopener noreferrer";
    t.appendChild(a); s.appendChild(t);
    s.appendChild(el("div", "price", kr(f.price)));

    var m = el("div", "meta");
    var dcls = f.direct === "Ja" ? "ok" : f.direct === "Nej" ? "no" : "warn";
    var list = [
      [f.type, null], [f.colors.join(" / "), null], [f.plat, null], [f.city, null],
      [f.status, f.status === "Bekræftet" ? "ok" : "warn"],
      ["Køb direkte: " + f.direct, dcls],
      [dateLabel(f), null],
      ["Tjekket " + dm(f.lastChecked), null]
    ];
    list.forEach(function (x, i) { if (i) m.appendChild(el("span", "sep", "·")); m.appendChild(el("span", x[1], x[0])); });
    s.appendChild(m);
    d.appendChild(s);

    var more = el("div", "more");
    if (f.note) more.appendChild(el("p", null, f.note));
    var hp = el("p"); hp.appendChild(el("strong", null, "Pris: "));
    hp.appendChild(document.createTextNode(f.priceHistory.map(function (x) { return x.d + " " + kr(x.p); }).join(" → ")));
    more.appendChild(hp);
    var lp = el("p"); lp.appendChild(el("strong", null, "Sidst tjekket: "));
    lp.appendChild(document.createTextNode(dmy(f.lastChecked) + " kl. " + hm(f.lastChecked) + ". Annoncen findes stadig."));
    more.appendChild(lp);
    more.appendChild(el("p", null, "Fundet første gang " + dmy(f.firstSeen) + "."));
    d.appendChild(more);
    return d;
  }

  function filtered() {
    var q = els.q.value.trim().toLowerCase();
    var out = FINDS.filter(function (f) {
      if (els.direct.checked && f.direct !== "Ja") return false;
      if (q) {
        var h = [f.name, f.type, f.colors.join(" "), f.city, f.plat, f.note, f.status].join(" ").toLowerCase();
        var terms = q.split(/\s+/);
        for (var i = 0; i < terms.length; i++) if (h.indexOf(terms[i]) === -1) return false;
      }
      return true;
    });
    var s = els.sort.value;
    out.sort(function (x, y) {
      if (s === "asc") return x.price - y.price;
      if (s === "desc") return y.price - x.price;
      return Date.parse(y.listedAt) - Date.parse(x.listedAt);
    });
    return out;
  }

  function draw() {
    els.liste.textContent = "";
    var list = filtered();
    if (!FINDS.length) els.liste.appendChild(el("div", "empty", "Ingen fund endnu."));
    else if (!list.length) els.liste.appendChild(el("div", "empty", "Ingen fund for de valgte filtre."));
    list.forEach(function (f) { els.liste.appendChild(render(f)); });
    els.count.textContent = list.length + " af " + FINDS.length + " annoncer";
  }

  function drawTabs() {
    els.tabs.textContent = "";
    var b = el("button", "tab", CATEGORY.name);
    b.type = "button"; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", "true");
    b.appendChild(el("span", "n", String(FINDS.filter(function (f) { return f.available !== "nej"; }).length)));
    els.tabs.appendChild(b);
  }

  function drawRuns() {
    els.runs.textContent = "";
    els.runs.appendChild(el("h2", "runs-h", "Søgedækning og begrænsninger"));
    var d = el("details"); d.open = true;
    d.appendChild(el("summary", null, "Kørsel " + dmy(RUN.date) + " kl. " + hm(RUN.date) + " · " + RUN.platforms.join(", ")));
    RUN.sections.forEach(function (sec) {
      d.appendChild(el("h4", null, sec.title));
      var ul = el("ul");
      sec.items.forEach(function (it) { ul.appendChild(el("li", null, it)); });
      d.appendChild(ul);
    });
    els.runs.appendChild(d);
  }

  function drawHeader() {
    var active = FINDS.filter(function (f) { return f.available !== "nej"; }).length;
    els.sub.textContent = "Seneste kørsel " + dmy(RUN.date) + " kl. " + hm(RUN.date) + " · " + RUN.platforms.join(" og ") + " · " +
      active + (active === 1 ? " annonce online" : " annoncer online") + " · " + CATEGORY.workbook + ", ark " + CATEGORY.sheet;
  }

  els.q.addEventListener("input", draw);
  els.direct.addEventListener("change", draw);
  els.sort.addEventListener("change", draw);
  els.reset.addEventListener("click", function () { els.q.value = ""; els.direct.checked = false; els.sort.value = "new"; draw(); });

  drawHeader(); drawTabs(); draw(); drawRuns();
})();
</script>
</body>
</html>
