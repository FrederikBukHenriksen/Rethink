<title>Rethink søgerapport</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Bricolage+Grotesque:wght@600;700&family=Quicksand:wght@300&display=swap">
<style>
/* Layout: flad liste. Lille Rethink-skriftmærke øverst, så filtre og liste. Hver annonce er to linjer: titel + pris, og én linje detaljer. */
:root {
  --bg: #f2f5f3;
  --surface: #ffffff;
  --fg: #16211e;
  --muted: #5b6a65;
  --line: #d6dfdb;
  --accent: #1d5c52;
  --accent-soft: #dcebe7;
  --ok: #1e6b3a;
  --warn: #8a5a00;
  --no: #8f2d2d;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-logo: "Quicksand", "Nunito", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1614; --surface: #17211e; --fg: #e6eeea; --muted: #9aaba5; --line: #2a3834;
    --accent: #6cc4b2; --accent-soft: #1e3531; --ok: #7fd49a; --warn: #e8b85a; --no: #ee9a9a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1614; --surface: #17211e; --fg: #e6eeea; --muted: #9aaba5; --line: #2a3834;
  --accent: #6cc4b2; --accent-soft: #1e3531; --ok: #7fd49a; --warn: #e8b85a; --no: #ee9a9a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 820px; margin: 0 auto; display: grid; gap: 24px; }
h1, h2 { font-family: var(--font-display); letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
h1 { font-size: 28px; line-height: 1.1; }
h2 { font-size: 18px; }
a { color: inherit; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.head { display: grid; gap: 6px; }
.logo { font-family: var(--font-logo); font-weight: 300; font-size: 20px; letter-spacing: 0.18em; line-height: 1; color: var(--fg); }
.logo .bar { display: inline-block; width: 2px; height: 1.2em; margin-left: 0.55em; background: currentColor; vertical-align: -0.2em; }
.sub { margin: 0; color: var(--muted); font-size: 13px; }

.filters { display: grid; gap: 10px; }
.filters-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 620px) { .filters-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.field { display: grid; gap: 3px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
input[type="search"], input[type="number"], select {
  font: inherit; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; width: 100%;
}
.count-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.reset { font: inherit; font-size: 13px; background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.reset:hover { background: var(--accent-soft); }

.section.tjek h2 { border-bottom-color: var(--warn); }
.lead { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.empty { padding: 14px 0; color: var(--muted); border-bottom: 1px solid var(--line); }

details.item { border-bottom: 1px solid var(--line); }
details.item summary {
  list-style: none; cursor: pointer; padding: 11px 0;
  display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto; column-gap: 14px; row-gap: 2px;
}
details.item summary::-webkit-details-marker { display: none; }
.thumb { grid-column: 1; grid-row: 1 / span 2; align-self: center; width: 52px; height: 52px; border-radius: 8px; overflow: hidden; background: var(--accent-soft); border: 1px solid var(--line); }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.title { grid-column: 2; grid-row: 1; min-width: 0; font-weight: 600; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title a { text-decoration: none; }
.title a:hover { text-decoration: underline; color: var(--accent); }
.price { grid-column: 3; grid-row: 1; font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.price small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.meta { grid-column: 2 / -1; min-width: 0; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta .sep { padding-inline: 5px; opacity: .6; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .no { color: var(--no); }
.more { padding: 0 0 12px; display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.more p { margin: 0; overflow-wrap: anywhere; }
.more strong { color: var(--fg); }

.cover h2 { margin-bottom: 4px; }
.cover details { border-top: 1px solid var(--line); padding-block: 9px; }
.cover summary { cursor: pointer; font-weight: 600; }
.cover ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 5px; color: var(--muted); font-size: 14px; }

.ms { position: relative; min-width: 0; }
.ms-btn { font: inherit; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 6px; text-align: left; background: var(--surface); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; cursor: pointer; }
.ms-btn.has { color: var(--fg); border-color: var(--accent); }
.ms-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms-caret { font-size: 11px; flex: none; }
.ms-panel { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; min-width: 100%; max-height: 260px; overflow: auto; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); }
.ms-opt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 5px; cursor: pointer; white-space: nowrap; font-size: 14px; }
.ms-opt:hover { background: var(--accent-soft); }
.ms-opt input { accent-color: var(--accent); margin: 0; }
select.ph { color: var(--muted); }
select option { color: var(--fg); background: var(--surface); }
.group { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
.group.prod { background: var(--accent-soft); border-color: transparent; }
.group.ann { background: var(--surface); }
.group h3 { margin: 0; font-family: var(--font-mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); }
.group .filters-grid { align-items: center; }
.group.prod .filters-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 620px) { .group.prod .filters-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.check { display: flex; align-items: center; gap: 8px; padding-block: 7px; cursor: pointer; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.results { display: grid; gap: 0; }
.listbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding-bottom: 8px; border-bottom: 2px solid var(--fg); color: var(--muted); font-size: 13px; }
.listbar-r { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.listbar-r select { width: auto; padding: 4px 8px; }
.item.gone .title a { text-decoration: line-through; color: var(--muted); }
.item.gone { opacity: 0.7; }
.delta { font-family: var(--font-body); font-size: 12px; font-weight: 500; margin-left: 6px; }
.runs-h { margin: 0 0 4px; }
.cover h4 { margin: 10px 0 0; font-size: 14px; }
.cover .run-meta { color: var(--muted); font-size: 13px; }
.runbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.runbar[hidden] { display: none; }
.runbar button { font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); cursor: pointer; }
.runbar button:disabled { opacity: 0.55; cursor: default; }
.runbar .runstat { font-size: 13px; color: var(--muted); min-width: 0; }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tab { font: inherit; font-weight: 600; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; color: var(--muted); padding: 10px 14px; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .n { font-family: var(--font-mono); font-size: 12px; font-weight: 400; margin-left: 7px; color: var(--muted); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.acc { color: var(--accent); }
.starbtn { width: 32px; height: 32px; padding: 0; font-size: 20px; line-height: 1; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; align-self: center; grid-row: 1; grid-column: 4; }
.starbtn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.starbtn:disabled { opacity: .45; cursor: default; }
.starbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 520px) {
  h1 { font-size: 24px; }
  details.item summary { grid-template-columns: 40px minmax(0, 1fr) auto auto; column-gap: 10px; }
  .thumb { width: 40px; height: 40px; }
  .meta { font-size: 12px; }
}
.views { display: flex; gap: 8px; }
.view-btn { font: inherit; font-weight: 600; background: var(--surface); color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 6px 16px; cursor: pointer; }
.view-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.sheet-wrap { display: grid; gap: 10px; }
.sheet-note { margin: 0; color: var(--muted); font-size: 13px; }
.sheet-scroll { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-height: 70vh; }
table.sheet { border-collapse: separate; border-spacing: 0; font-size: 13.5px; min-width: 100%; }
.sheet th { position: sticky; top: 0; z-index: 2; background: var(--accent-soft); font-family: var(--font-mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; text-align: left; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.sheet th.plat, .sheet td.plat { text-align: center; }
.sheet td { padding: 0; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); vertical-align: middle; }
.sheet td.rn { padding: 6px 8px; font-family: var(--font-mono); color: var(--muted); text-align: right; position: sticky; left: 0; background: var(--surface); z-index: 1; }
.sheet input[type="text"], .sheet input[type="number"] { font: inherit; color: var(--fg); background: transparent; border: 0; border-radius: 0; padding: 7px 8px; width: 100%; min-width: 110px; }
.sheet input.w-sm { min-width: 80px; }
.sheet input.w-lg { min-width: 170px; }
.sheet input:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--bg); }
.sheet input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); margin: 8px; }
.sheet .ro { display: block; padding: 7px 8px; min-width: 80px; }
.pop-btn { border: 0; border-radius: 0; min-width: 120px; background: transparent; }
.pop-panel { position: fixed; z-index: 50; min-width: 160px; }
.sheet-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 13px; }
.sheet-err { color: var(--no); }
.del-btn { width: 32px; height: 32px; padding: 0; margin: 4px; display: inline-flex; align-items: center; justify-content: center; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.del-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.del-btn:hover { color: var(--no); border-color: var(--no); }
.del-btn.armed { color: var(--surface); background: var(--no); border-color: var(--no); }
.del-btn:disabled { opacity: 0.4; cursor: default; }
.picker-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.picker { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: min(560px, 100%); max-height: 90vh; overflow: auto; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35); display: grid; gap: 14px; }
.picker-title { margin: 0; font-family: var(--font-display); font-size: 18px; letter-spacing: -0.01em; }
.picker-tools, .picker-foot { display: flex; flex-wrap: wrap; gap: 10px; }
.picker-btn { font: inherit; font-size: 14px; font-weight: 600; background: var(--surface); color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.picker-btn:hover { background: var(--accent-soft); }
.picker-btn.primary { background: var(--accent); color: var(--surface); }
.picker-btn.primary:hover { filter: brightness(1.08); }
.picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.picker-tile { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 14px; }
.picker-tile.on { border-color: var(--accent); background: var(--accent-soft); }
.picker-tile input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.picker-foot { justify-content: flex-start; position: sticky; bottom: -20px; margin: 0 -20px -20px; padding: 12px 20px 20px; background: var(--surface); border-top: 1px solid var(--line); border-radius: 0 0 12px 12px; }
.picker-note { margin: 0; color: var(--muted); font-size: 13px; }
.picker-tile input:disabled { cursor: default; }
</style>

<main>
  <div class="runbar" id="runbar" hidden>
    <button type="button" id="runbtn">Start søgning</button>
    <span class="runstat" id="runstat" role="status" aria-live="polite">Søger alle søgelinjer i alle kategorier.</span>
  </div>
  <header class="head">
    <div class="logo" role="img" aria-label="Rethink">RETHINK<span class="bar" aria-hidden="true"></span></div>
    <h1>Søgerapport</h1>
    <p class="sub" id="sub">Henter fund …</p>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Søgninger"></nav>

  <div class="views" role="group" aria-label="Visning">
    <button class="view-btn" id="v-finds" type="button" aria-pressed="true">Fund</button>
    <button class="view-btn" id="v-sheet" type="button" aria-pressed="false">Søgeliste</button>
  </div>

  <section class="sheet-wrap" id="sheet" aria-label="Søgeliste" hidden></section>

  <div id="finds-view" style="display:grid;gap:24px">
  <section class="filters" aria-label="Filtre">
    <input id="q" type="search" placeholder="Søg i model, by, forbehold …" aria-label="Søg" autocomplete="off">
    <div class="group prod" role="group" aria-label="Produkt">
      <h3>Produkt</h3>
      <div class="filters-grid">
        <div class="ms" id="f-model" data-label="Model"></div>
        <div class="ms" id="f-designer" data-label="Designer"></div>
        <div class="ms" id="f-producer" data-label="Producent"></div>
        <div class="ms" id="f-type" data-label="Type"></div>
        <div class="ms" id="f-color" data-label="Farve"></div>
        <input id="f-max" type="number" min="0" step="50" inputmode="numeric" placeholder="Maks. pris (kr.)" aria-label="Maks. pris i kroner">
      </div>
    </div>
    <div class="group ann" role="group" aria-label="Annonce">
      <h3>Annonce</h3>
      <div class="filters-grid">
        <div class="ms" id="f-plat" data-label="Platform"></div>
        <select id="f-time" class="ph" aria-label="Tid"><option value="">Tid</option><option value="24">24 timer</option><option value="48">48 timer</option><option value="72">72 timer</option><option value="168">7 dage</option><option value="720">1 måned</option></select>
        <label class="check" for="f-direct"><input id="f-direct" type="checkbox"> Kan købes direkte</label>
        <label class="check" for="f-fav"><input id="f-fav" type="checkbox"> Kun favoritter</label>
      </div>
    </div>
  </section>

  <div class="results">
    <div class="listbar">
      <span id="count" aria-live="polite"></span>
      <div class="listbar-r">
        <select id="f-sort" class="ph" aria-label="Sortér"><option value="">Sortér</option><option value="new">Nyeste først</option><option value="asc">Pris, lav først</option><option value="desc">Pris, høj først</option></select>
        <button id="reset" class="reset" type="button">Nulstil filtre</button>
      </div>
    </div>
    <section id="liste" class="section" aria-label="Fund"></section>
  </div>

  <section class="cover" id="runs" aria-label="Søgedækning og begrænsninger"></section>
  </div>
</main>


<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var els = {
    q: $("q"), time: $("f-time"), direct: $("f-direct"), fav: $("f-fav"),
    max: $("f-max"), sort: $("f-sort"), liste: $("liste"), count: $("count"), reset: $("reset"),
    sub: $("sub"), runs: $("runs"), tabs: $("tabs"), sheet: $("sheet"), fview: $("finds-view"), vFinds: $("v-finds"), vSheet: $("v-sheet")
  };
  var ALL_MULTI = [];
  var state = { finds: [], targets: {}, runs: [], favs: {}, allFinds: [], allTargets: [], allRuns: [], categories: [], cat: null, loaded: { finds: false, targets: false, runs: false }, error: false, fbError: false, favFilterOn: false, view: "finds", sheetErr: false };
  var DB = null, canWrite = null, openIds = {}, chain = {};
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function sep() { return el("span", "sep", "·"); }
  function kr(n) { return Number(n).toLocaleString("da-DK") + " kr."; }
  function uniqSorted(list) {
    var seen = [];
    list.forEach(function (v) { if (v && seen.indexOf(v) === -1) seen.push(v); });
    return seen.sort(function (a, b) { return a.localeCompare(b, "da"); });
  }
  var TZ = "Europe/Copenhagen";
  function parts(iso) {
    var t = Date.parse(iso);
    if (isNaN(t)) return null;
    var o = {};
    new Intl.DateTimeFormat("da-DK", { timeZone: TZ, day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
      .formatToParts(new Date(t)).forEach(function (p) { o[p.type] = p.value; });
    return o;
  }
  function dm(iso) { var p = parts(iso); return p ? p.day + "." + p.month : ""; }
  function dmy(iso) { var p = parts(iso); return p ? p.day + "." + p.month + "." + p.year : ""; }
  function hm(iso) { var p = parts(iso); return p ? p.hour + "." + p.minute : ""; }
  function dateLabel(f) {
    if (!f.listedAt) return "Dato ukendt";
    var kind = f.dateKind === "uploadet" ? "Uploadet" : "Redigeret";
    return kind + " " + dm(f.listedAt) + (f.dateApprox ? " ca. kl. " + hm(f.listedAt).split(".")[0] : " kl. " + hm(f.listedAt));
  }

  /* Dropdown med flere valg. Navnet vises, indtil noget er valgt. */
  function makeMulti(root) {
    var label = root.getAttribute("data-label");
    var btn = el("button", "ms-btn");
    btn.type = "button";
    btn.setAttribute("aria-haspopup", "true");
    btn.setAttribute("aria-expanded", "false");
    var txt = el("span", "ms-text", label);
    btn.appendChild(txt);
    btn.appendChild(el("span", "ms-caret", "▾"));
    var panel = el("div", "ms-panel");
    panel.hidden = true;
    root.appendChild(btn);
    root.appendChild(panel);
    var api = { root: root, chosen: [] };
    api.get = function () { return api.chosen.slice(); };
    function sync() {
      txt.textContent = api.chosen.length ? api.chosen.join(", ") : label;
      btn.classList.toggle("has", api.chosen.length > 0);
    }
    api.setValues = function (values) {
      api.chosen = api.chosen.filter(function (v) { return values.indexOf(v) !== -1; });
      panel.textContent = "";
      values.forEach(function (v) {
        var lab = el("label", "ms-opt");
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = v;
        cb.checked = api.chosen.indexOf(v) !== -1;
        lab.appendChild(cb);
        lab.appendChild(document.createTextNode(v));
        panel.appendChild(lab);
      });
      sync();
    };
    api.close = function () { panel.hidden = true; btn.setAttribute("aria-expanded", "false"); };
    api.clear = function () {
      api.chosen = [];
      Array.prototype.forEach.call(panel.querySelectorAll("input"), function (b) { b.checked = false; });
      sync();
    };
    btn.addEventListener("click", function () {
      var open = panel.hidden;
      ALL_MULTI.forEach(function (a) { a.close(); });

      var v = patch[k];
      if (v && typeof v === "object" && !Array.isArray(v)) return Object.keys(v).every(function (k) { return !v[k]; });
      return v === "" || v === null || v === false || (Array.isArray(v) && v.length === 0);
    });
    if (empty) return Promise.resolve();
    var doc = { category: state.cat, row: t.row, model: "", active: true, types: [], type: "", designers: [], producers: [], keywords: [], excludeKeywords: [], colorsAllowed: [], colorsRejected: [], maxPrice: null, images: [], platforms: {} };
    Object.keys(patch).forEach(function (k) { doc[k] = patch[k]; });
    state.createdRows[key] = true;
    return ref.set(doc);
  }
  function drawSheet() {
    var root = els.sheet;
    var isSheet = state.view === "sheet";
    if (popOpen) return;
    root.hidden = !isSheet;
    els.fview.style.display = isSheet ? "none" : "grid";
    els.vFinds.setAttribute("aria-pressed", String(!isSheet));
    els.vSheet.setAttribute("aria-pressed", String(isSheet));
    if (!isSheet) return;
    if (document.activeElement && root.contains(document.activeElement) && document.activeElement.tagName === "INPUT" && document.activeElement.type !== "checkbox") return;
    state.gone = state.gone || {};
    Object.keys(state.gone).forEach(function (id) {
      if (!state.allTargets.some(function (t) { return t.id === id; })) delete state.gone[id];
    });
    var sigRows = state.allTargets.filter(function (t) { return catOf(t) === state.cat && !state.gone[t.id]; });
    var catDoc = cats().filter(function (c) { return c.id === state.cat; })[0] || {};
    var sig = JSON.stringify([state.cat, !!DB, state.sheetErr, state.error, state.loaded.targets, sigRows, sheetPlats(), catDoc.types || null]);
    if (sig === state.sheetSig && root.childNodes.length) return;
    state.sheetSig = sig;
    root.textContent = "";
    if (state.error) { root.appendChild(el("div", "empty", "Søgelisten kan ikke hentes. Åbn siden i claude.ai og log ind.")); return; }
    if (!state.loaded.targets) { root.appendChild(el("div", "empty", "Henter søgeliste …")); return; }
    var edit = !!DB;
    var cur = cats().filter(function (c) { return c.id === state.cat; })[0] || {};
    var rows = state.allTargets.filter(function (t) { return catOf(t) === state.cat && !state.gone[t.id]; })
      .sort(function (a, b) { return (Number(a.row) || 0) - (Number(b.row) || 0); });
    var plats = sheetPlats();
    var typeOpts = (cur.types && cur.types.length) ? cur.types : TYPES;

    var bar = el("div", "sheet-bar");
    var left = el("span", null, rows.length + (rows.length === 1 ? " række" : " rækker") + " · " + (cur.name || state.cat));
    if (state.sheetErr) { left.appendChild(document.createTextNode(" · ")); left.appendChild(el("span", "sheet-err", "Ændringen kunne ikke gemmes")); }
    bar.appendChild(left);
    root.appendChild(bar);
    root.appendChild(el("p", "sheet-note", "Hver række er en søgning. Aktiv: kun afkrydsede rækker søges. Type, farver og platforme vælges i en dialog med afkrydsning; er ingen platform valgt, søges rækken ikke. Flere værdier i én celle skilles med semikolon. Tom model: søg på designer eller producent. Tom maks pris: ingen grænse." + (edit ? " Ændringer gemmes med det samme." : " Kun ejeren kan redigere.")));

    var wrap = el("div", "sheet-scroll");
    var tbl = el("table", "sheet");
    var thead = el("thead"), hr = el("tr");
    hr.appendChild(el("th", "plat", "Aktiv"));
    COLS.forEach(function (c) { hr.appendChild(el("th", null, c.label)); });
    hr.appendChild(el("th", null, ""));
    thead.appendChild(hr); tbl.appendChild(thead);
    var tb = el("tbody");
    var nextRow = rows.length ? Math.max.apply(null, rows.map(function (t) { return Number(t.row) || 0; })) + 1 : 2;
    rows.concat([{ blank: true, row: nextRow, active: true }]).forEach(function (t) {
      var tr = el("tr");
      var atd = el("td", "plat rn");
      var acb = document.createElement("input");
      acb.type = "checkbox"; acb.checked = t.active !== false; acb.disabled = !edit || !!t.blank;
      acb.title = "Aktiv: søges denne række?";
      acb.setAttribute("aria-label", "Aktiv, række " + t.row);
      acb.addEventListener("change", function () { sheetWrite(function () { return writeRow(t, { active: acb.checked }); }); });
      atd.appendChild(acb); tr.appendChild(atd);
      if (t.active === false) tr.style.opacity = "0.55";
      COLS.forEach(function (c) {
        var td = el("td");
        if (c.t === "m" || c.t === "p") {
          if (c.t === "m") {
            td.appendChild(popCell(c.label + ", række " + t.row, c.k === "types" ? typeOpts : c.opts, function () { return colVal(t, c) || []; }, function (list) {
              var patch = {}; patch[c.k] = list;
              if (c.k === "types") patch.type = list.join("; ");
              sheetWrite(function () { return writeRow(t, patch); });
            }, edit, pickTitle(c, t), true));
          } else {
            td.appendChild(popCell("Platforme, række " + t.row, plats, function () { return plats.filter(function (p) { return t.platforms && t.platforms[p]; }); }, function (list) {
              var map = {};
              plats.forEach(function (p) { map[p] = list.indexOf(p) !== -1; });
              var patch = { platforms: map };
              sheetWrite(function () { return writeRow(t, patch); });
            }, edit, "Hvilke platforme skal søges for " + rowName(t) + "?", false));
          }
          tr.appendChild(td);
          return;
        }
        var v = colVal(t, c);
        var text = c.t === "l" ? (v || []).join("; ") : v == null ? "" : String(v);
        if (!edit) { td.appendChild(el("span", "ro", text)); }
        else {
          var inp = document.createElement("input");
          inp.type = c.t === "n" ? "number" : "text";
          if (c.t === "n") { inp.min = "0"; inp.step = "50"; inp.inputMode = "numeric"; }
          inp.className = c.w; inp.value = text;
          inp.setAttribute("aria-label", c.label + ", række " + t.row);
          inp.addEventListener("change", function () { saveCell(t, c, inp.value); });
          td.appendChild(inp);
        }
        tr.appendChild(td);
      });
      var dtd = el("td", "plat");
      if (!t.blank) {
        var del = el("button", "del-btn");
        del.type = "button";
        del.innerHTML = ICONS.skrald;
        del.setAttribute("aria-label", "Slet række " + t.row);
        del.title = "Slet række " + t.row;
        del.disabled = !edit;
        del.addEventListener("click", function () {
          if (!del.classList.contains("armed")) { del.classList.add("armed"); del.title = "Tryk igen for at slette række " + t.row; return; }
          /* Rækken skjules med det samme; kommer den tilbage, fordi sletningen fejlede, vises den igen. */
          state.gone = state.gone || {};
          state.gone[t.id] = true;
          state.sheetSig = null;
          drawSheet();
          sheetWrite(function () {
            return DB.doc("targets/" + t.id).delete().catch(function (err) { delete state.gone[t.id]; throw err; });
          });
        });
        del.addEventListener("blur", function () { del.classList.remove("armed"); });
        dtd.appendChild(del);
      }
      tr.appendChild(dtd);
      tb.appendChild(tr);
    });
    tbl.appendChild(tb); wrap.appendChild(tbl); root.appendChild(wrap);
  }
  function setView(v) {
    state.view = v;
    try { var h = (location.hash || "").slice(1).split("/")[0]; location.hash = h ? h + (v === "sheet" ? "/soegeliste" : "") : (v === "sheet" ? "/soegeliste" : ""); } catch (e) {}
    drawSheet();
  }
  els.vFinds.addEventListener("click", function () { setView("finds"); });
  els.vSheet.addEventListener("click", function () { setView("sheet"); });

  [els.q, els.max].forEach(function (e) { e.addEventListener("input", draw); });
  [els.time, els.sort].forEach(function (e) {
    e.addEventListener("change", function () { syncPlaceholder(e); draw(); });
  });
  [els.direct, els.fav].forEach(function (e) { e.addEventListener("change", function () { draw(); }); });
  function resetFilters() {
    els.q.value = ""; els.max.value = "";
    els.direct.checked = false; els.fav.checked = false;
    els.time.value = ""; els.sort.value = "";
    syncPlaceholder(els.time); syncPlaceholder(els.sort);
    ALL_MULTI.forEach(function (a) { a.clear(); a.close(); });
  }
  els.reset.addEventListener("click", function () { resetFilters(); draw(); });
  window.addEventListener("hashchange", function () {
    var hs = (location.hash || "").slice(1).split("/"), h = hs[0];
    var wantSheet = hs[1] === "soegeliste";
    if (wantSheet !== (state.view === "sheet")) { state.view = wantSheet ? "sheet" : "finds"; drawSheet(); }
    if (h && h !== state.cat && cats().some(function (c) { return c.id === h; })) switchCat(h);
  });

  function fail() { state.error = true; els.sub.textContent = "Fundene kan ikke hentes"; draw(); }
  var use = window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null);
  use.then(function (db) {
    if (!db) { fail(); return; }
    DB = db;
    db.collection("finds").onSnapshot(function (snap) {
      state.allFinds = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      state.loaded.finds = true; refresh();
    }, fail);
    db.collection("targets").onSnapshot(function (snap) {
      state.allTargets = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      state.loaded.targets = true; refresh();
    }, fail);
    db.collection("categories").onSnapshot(function (snap) {
      state.categories = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })
        .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      refresh();
    }, function () {});
    db.collection("favorites").onSnapshot(function (snap) {
      var m = {};
      snap.docs.forEach(function (d) { m[d.id] = d.data(); });
      state.favs = m; refresh();
    }, function () { state.favs = {}; });
    db.collection("runs").orderBy("date", "desc").limit(20).onSnapshot(function (snap) {
      state.allRuns = snap.docs.map(function (d) { return d.data(); });
      state.loaded.runs = true; refresh();
    }, fail);
  }, fail);
  if (window.claude && window.claude.use) {
    window.claude.use("user").then(function (u) {
      if (u && typeof u.isOwner === "function") { canWrite = u.isOwner(); draw(); drawSheet(); runUI(); }
    }, function () {});
  }
  /* Knap øverst (merged med live v1794241086): bestiller en søgning af alle søgelinjer i alle kategorier. Claude samler bestillingen op (requests/search). */
  function runUI() {
    var bar = $("runbar"), btn = $("runbtn"), st = $("runstat");
    if (!DB || canWrite !== true) { bar.hidden = true; return; }
    bar.hidden = false;
    var r = state.req || {};
    var busy = r.status === "bestilt" || r.status === "kører";
    btn.disabled = busy;
    if (r.status === "bestilt") st.textContent = "Søgning bestilt " + dmy(r.requestedAt) + " kl. " + hm(r.requestedAt) + ". Venter på at Claude starter.";
    else if (r.status === "kører") st.textContent = "Søgning kører siden " + dmy(r.startedAt) + " kl. " + hm(r.startedAt) + ".";
    else if (r.status === "færdig") st.textContent = "Seneste bestilte søgning blev færdig " + dmy(r.finishedAt) + " kl. " + hm(r.finishedAt) + ". Søger alle søgelinjer i alle kategorier.";
    else st.textContent = "Søger alle søgelinjer i alle kategorier.";
  }
  $("runbtn").addEventListener("click", function () {
    if (!DB || canWrite !== true) return;
    var btn = $("runbtn"); btn.disabled = true;
    DB.doc("requests/search").set({ status: "bestilt", requestedAt: new Date().toISOString(), scope: "alle" })
      .then(function () {}, function () { $("runstat").textContent = "Søgningen kunne ikke bestilles."; btn.disabled = false; });
  });
  var reqWatch = false;
  var _ready = setInterval(function () {
    if (DB && !reqWatch) {
      reqWatch = true;
      DB.doc("requests/search").onSnapshot(function (snap) { state.req = snap.exists ? snap.data() : null; runUI(); }, function () {});
    }
    runUI();
  }, 1500);
  setTimeout(function () { clearInterval(_ready); }, 20000);
  draw();
})();
</script>
